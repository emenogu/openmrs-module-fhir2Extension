name: NMHS UPSTREAM-002 IPD-ADOPT-001A Validation

on:
  push:
    branches:
      - upstream-002-ipd-adopt-001a-hosted-validation-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SOURCE_COMMIT: 94ca12389e430064eb404304e1054501fd8e2409
      SOURCE_PARENT: 8d342c7b66bf05193559254954041d2db88ee6df
      NMHS_VERSION: 2.0.0-nmhs-ipd001a.1

    steps:
      - name: Checkout validation control
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Verify immutable source and control topology
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD^)" = "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT^")" = "$SOURCE_PARENT"

          git diff --name-only "$SOURCE_PARENT" "$SOURCE_COMMIT" | sort > /tmp/source-files.txt

          printf '%s\n' \
            'api/pom.xml' \
            'omod/pom.xml' \
            'omod/src/main/java/org/openmrs/module/fhirExtension/web/contract/TaskFhirReference.java' \
            'omod/src/main/java/org/openmrs/module/fhirExtension/web/contract/TaskRequest.java' \
            'omod/src/main/java/org/openmrs/module/fhirExtension/web/contract/TaskResponse.java' \
            'omod/src/main/java/org/openmrs/module/fhirExtension/web/mapper/TaskMapper.java' \
            'omod/src/test/java/org/openmrs/module/fhirExtension/web/mapper/TaskMapperTest.java' \
            'pom.xml' | sort > /tmp/expected-files.txt

          diff -u /tmp/expected-files.txt /tmp/source-files.txt

          test "$(git diff --name-only "$SOURCE_COMMIT" HEAD)" = '.github/workflows/nmhs-upstream-002-ipd-adopt-001a.yml'

          if git diff "$SOURCE_PARENT" "$SOURCE_COMMIT" | grep -E 'saveTasks\(|"/bulk"|TaskInputRequestDTO|TaskInputResponseDTO|@JsonProperty\("for"\)|private TaskFhirReference forReference' ; then
            echo 'Forbidden deferred feature found in source delta'
            false
          fi

          grep -F '<openmrs.fhir2.version>2.5.1</openmrs.fhir2.version>' pom.xml
          grep -F "<version>${NMHS_VERSION}</version>" pom.xml
          grep -F "<version>${NMHS_VERSION}</version>" api/pom.xml
          grep -F "<version>${NMHS_VERSION}</version>" omod/pom.xml
          grep -F 'private TaskFhirReference focus;' omod/src/main/java/org/openmrs/module/fhirExtension/web/contract/TaskRequest.java
          grep -F 'private TaskFhirReference basedOn;' omod/src/main/java/org/openmrs/module/fhirExtension/web/contract/TaskRequest.java
          grep -F 'setFocusReference' omod/src/main/java/org/openmrs/module/fhirExtension/web/mapper/TaskMapper.java
          grep -F 'setBasedOnReferences' omod/src/main/java/org/openmrs/module/fhirExtension/web/mapper/TaskMapper.java

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Verify Maven coordinates and FHIR2 dependency
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_VERSION="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          test "$PROJECT_VERSION" = "$NMHS_VERSION"

          ./mvnw --no-transfer-progress -DskipTests dependency:tree \
            -Dincludes=org.openmrs.module:fhir2-api,org.openmrs.module:fhir2-omod \
            | tee dependency-tree.txt

          grep -F 'org.openmrs.module:fhir2-api:jar:2.5.1' dependency-tree.txt

      - name: Build and test candidate
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --no-transfer-progress clean install

      - name: Verify and hash OMOD
        shell: bash
        run: |
          set -euo pipefail

          find omod/target -maxdepth 1 -type f -name '*.omod' -print | sort > omod-files.txt
          test "$(wc -l < omod-files.txt)" -eq 1

          OMOD="$(cat omod-files.txt)"
          sha256sum "$OMOD" | tee omod-sha256.txt

          printf 'SOURCE_COMMIT=%s\n' "$SOURCE_COMMIT" > provenance.txt
          printf 'SOURCE_PARENT=%s\n' "$SOURCE_PARENT" >> provenance.txt
          printf 'NMHS_VERSION=%s\n' "$NMHS_VERSION" >> provenance.txt
          printf 'OMOD=%s\n' "$OMOD" >> provenance.txt
          cat omod-sha256.txt >> provenance.txt

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmhs-ipd-adopt-001a-fhir2extension
          if-no-files-found: error
          retention-days: 14
          path: |
            omod/target/*.omod
            dependency-tree.txt
            omod-sha256.txt
            provenance.txt
